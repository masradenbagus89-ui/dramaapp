# .github/workflows/audit-access.yml
# Pengingat Cek-Akses Bulanan - buka 1 catatan-tugas (Issue) tiap awal bulan,
# DAN tutup pengingat bulan-bulan sebelumnya supaya tidak menumpuk.
#
# Cara kerja:
#   - Jalan otomatis tiap tanggal 1 (juga bisa dipicu manual: Actions -> Run workflow).
#   - Membuka SATU Issue berisi langkah cek-akses bulan ini.
#   - Menutup Issue pengingat bulan LAIN yang masih terbuka, dengan komentar penunjuk.
#   - Robot ini CUMA mengingatkan. TIDAK mencabut akses apa pun (pencabutan = keputusan manusia).
#
# DISETEL ULANG 2026-10-15, karena versi lama menumpuk jadi 4 Issue terbuka
# (Juli-Oktober) yang tak satu pun bisa diselesaikan. Dua sebabnya:
#   1. Ia menyuruh membandingkan dengan `lintasai-portfolio.yml` dan membuka
#      `docs/ACCESS_CONTROL_NREPO.md` -- KEDUANYA TIDAK PERNAH ADA di repo ini.
#      Tugas yang mustahil dikerjakan akan selalu jadi tumpukan, bukan kelalaian.
#      Penggantinya: `docs/akses-dan-kepemilikan.md`, dibuat dari audit sungguhan.
#   2. Tak ada yang menutup Issue lama, jadi tiap bulan menambah satu. Pengingat
#      yang menumpuk berhenti dibaca -- dan saat itu ia berhenti jadi pengingat.
#
# Catatan: GitHub menonaktifkan jadwal otomatis kalau repo TIDAK ada commit selama 60 hari.
#          Kalau repo jarang di-update, picu manual saja sesekali (Actions -> Run workflow).

name: Pengingat Cek-Akses Bulanan

on:
  schedule:
    # Tiap tanggal 1, jam 01:00 UTC (sekitar 08:00 WIB).
    - cron: '0 1 1 * *'
  workflow_dispatch: {}

# Hak akses minimum: cuma boleh buat/menulis/menutup Issue.
# TIDAK boleh ubah kode maupun mengubah akses siapa pun.
permissions:
  issues: write

jobs:
  remind:
    name: Buka pengingat cek-akses
    runs-on: ubuntu-latest
    steps:
      - name: Buat pengingat bulan ini + tutup pengingat bulan lalu
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const PREFIX = '[Keamanan] Cek-akses bulanan';
            const ym = new Date().toISOString().slice(0, 7); // contoh: 2026-10
            const title = `${PREFIX} ${ym}`;
            const { owner, repo } = context.repo;

            // Dipakai listForRepo, BUKAN search. Search punya jeda pengindeksan dan
            // kuota tersendiri -- versi lama sampai perlu menelan error-nya. Daftar
            // Issue terbuka selalu akurat seketika dan tak punya jeda itu.
            const terbuka = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const pengingat = terbuka.filter(
              (i) => !i.pull_request && i.title.startsWith(PREFIX),
            );

            const bulanIni = pengingat.find((i) => i.title === title);
            let nomorBaru = bulanIni?.number;

            if (bulanIni) {
              core.info(`Pengingat ${ym} sudah ada (#${bulanIni.number}) - tidak membuat duplikat.`);
            } else {
              const body = [
                '## Waktunya cek-akses bulanan (READ-ONLY)',
                '',
                'Pengingat otomatis. Pastikan siapa yang BISA mengakses repo & layanan kita',
                'masih cocok dengan Buku Induk: **`docs/akses-dan-kepemilikan.md`**.',
                '',
                '**Semua langkah hanya MEMBACA - tidak ada akses yang dicabut otomatis.**',
                '',
                '### 1. Jalankan (salin-tempel ke terminal, atau minta Claude Code menjalankannya)',
                '',
                '```bash',
                "gh api repos/masradenbagus89-ui/dramaapp/collaborators --jq '.[] | \"\\(.login) [\\(.role_name)]\"'",
                "gh api repos/ojokesusu/dramaku/collaborators          --jq '.[] | \"\\(.login) [\\(.role_name)]\"'",
                "gh api repos/masradenbagus89-ui/dramaapp/invitations  --jq '.[] | .invitee.login'",
                "gh api repos/masradenbagus89-ui/dramaapp/keys         --jq '.[] | .title'",
                "gh api repos/masradenbagus89-ui/dramaapp/actions/secrets   --jq '.secrets[].name'",
                "gh api repos/masradenbagus89-ui/dramaapp/actions/variables --jq '.variables[] | \"\\(.name)=\\(.value)\"'",
                '```',
                '',
                '### 2. Bandingkan dengan `docs/akses-dan-kepemilikan.md` bagian 1-3',
                '',
                '### 3. Ada yang tidak cocok?',
                '',
                '- Cabut manual: GitHub -> Settings -> Collaborators and teams -> Remove.',
                '  **Pencabutan = keputusan manusia, robot ini tidak pernah melakukannya.**',
                '- Lalu perbarui `docs/akses-dan-kepemilikan.md` supaya peta aksesnya tetap jujur.',
                '',
                '### 4. Yang masih terbuka dari audit terakhir',
                '',
                'Lihat `docs/akses-dan-kepemilikan.md` bagian 5 - jangan tutup Issue ini',
                'sebelum membacanya sekali.',
                '',
                '> Tutup Issue ini kalau sudah dicek. Kalau lupa, robot akan menutupnya',
                '> sendiri bulan depan sambil membuka yang baru.',
              ].join('\n');

              try {
                const dibuat = await github.rest.issues.create({ owner, repo, title, body });
                nomorBaru = dibuat.data.number;
                core.info(`Issue "${title}" dibuat (#${nomorBaru}).`);
              } catch (e) {
                // Jangan bikin workflow "merah" menakutkan kalau API error.
                core.warning(`Gagal membuat Issue pengingat (${e.message}). Cek-akses tetap bisa dijalankan manual - lihat docs/akses-dan-kepemilikan.md.`);
                return;
              }
            }

            // Tutup pengingat bulan LAIN yang masih menggantung. Tanpa ini, tiap bulan
            // menambah satu Issue dan tumpukannya berhenti dibaca orang.
            const basi = pengingat.filter((i) => i.number !== nomorBaru);
            for (const i of basi) {
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: i.number,
                  body: `Ditutup otomatis: sudah lewat bulannya. Pengingat yang berlaku sekarang: #${nomorBaru}.\n\nKalau cek-akses bulan itu memang belum pernah dijalankan, jalankan sekali di pengingat yang baru - bukan di sini.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: i.number, state: 'closed',
                });
                core.info(`Pengingat basi #${i.number} ditutup.`);
              } catch (e) {
                core.warning(`Gagal menutup #${i.number} (${e.message}) - lanjut.`);
              }
            }
